<article class="site-panel" data-pixel="heading" lang="{{ article.language }}" aria-labelledby="page-title">
  <div class="article-reading">
    <h1 id="page-title" class="prose-title">{{ article.title }}</h1>
    <small><a href="/maintainers/{{ article.author_id }}">{{ article.author }}</a> · {{ article.date }} UTC · {{ article.language|upper }}</small>
    <div class="article-bookmark" id="article-bookmark" lang="{% if en %}en{% else %}ru{% endif %}">
      {% if let Some(user) = viewer %}
      <form method="post" action="/account/bookmarks/{{ article.id }}">
        <input type="hidden" name="csrf" value="{{ user.csrf }}">
        <input type="hidden" name="from_article" value="true">
        <button class="brain-control" type="submit" name="intent" value="{% if bookmarked %}remove{% else %}save{% endif %}"><span class="brain-mark" aria-hidden="true"></span>{% if bookmarked %}{% if en %}Remove from saved articles{% else %}Убрать из сохранённых{% endif %}{% else %}{% if en %}Save article{% else %}Сохранить статью{% endif %}{% endif %}</button>
      </form>
      {% else %}
      <a class="brain-control" href="/account">{% if en %}Sign in to save{% else %}Войти, чтобы сохранить{% endif %}<span class="brain-arrow" aria-hidden="true">→</span></a>
      {% endif %}
    </div>
    <div class="markdown">{{ rendered|safe }}</div>
  </div>
</article>
